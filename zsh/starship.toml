# Ordem dos módulos: caminho completo -> git branch -> arquivos/linhas alterados -> PR -> duração do comando -> seta
format = "$directory$git_branch$git_commit$git_state${custom.git_changes}${custom.github_pr}$cmd_duration$line_break$character"
command_timeout = 1500

# Seta do prompt igual à Imagem 2 (➜ em vez de ❯)
[character]
success_symbol = "[➜](bold #9ece6a)"
error_symbol = "[➜](bold #f7768e)"

# Caminho completo a partir do ~ com ícone de pasta (ex:  ~/workplace/PhotoNow/api)
[directory]
style = "bold #c0caf5"
truncate_to_repo = false
truncation_length = 0
format = "[ $path]($style)[$read_only]($read_only_style) "

# Branch do Git em rosa/magenta vibrante
[git_branch]
symbol = " "
style = "bold #ff79c6"

# Desativa o [!?] padrão (substituído pelo custom.git_changes com contagem de arquivos e +linhas/-linhas)
[git_status]
disabled = true

# Contagem de arquivos alterados e linhas adicionadas/removidas (ex:  4 • +144 -3)
[custom.git_changes]
when = true
shell = ["sh"]
command = '''
porcelain=$(git status --porcelain 2>/dev/null) || exit 0
[ -z "$porcelain" ] && exit 0
files=$(printf "%s\n" "$porcelain" | wc -l | tr -d " ")
untracked_files=$(git ls-files --others --exclude-standard 2>/dev/null)
untracked_lines=0
if [ -n "$untracked_files" ]; then
  untracked_lines=$(git ls-files --others --exclude-standard -z 2>/dev/null | xargs -0 cat 2>/dev/null | wc -l | tr -d " ")
fi
read -r added deleted <<EOF
$(git diff HEAD --numstat 2>/dev/null | awk -v u="$untracked_lines" '$1 != "-" {a+=$1; d+=$2} END {print a+u, d+0}')
EOF
printf "\033[1;38;2;169;177;214m %s\033[0m" "$files"
if [ "$added" -gt 0 ] || [ "$deleted" -gt 0 ]; then
  printf " \033[38;2;169;177;214m•\033[0m"
  [ "$added" -gt 0 ] && printf " \033[1;38;2;158;206;106m+%s\033[0m" "$added"
  [ "$deleted" -gt 0 ] && printf " \033[1;38;2;247;118;142m-%s\033[0m" "$deleted"
fi
'''
format = "$output "

# Pull Request aberto da branch atual no GitHub com cache de 60s (ex:  PR #24)
[custom.github_pr]
when = true
shell = ["sh"]
command = '''
command -v gh >/dev/null 2>&1 || exit 0
toplevel=$(git rev-parse --show-toplevel 2>/dev/null) || exit 0
branch=$(git symbolic-ref --quiet --short HEAD 2>/dev/null) || exit 0
key=$(printf "%s:%s" "$toplevel" "$branch" | md5 -q)
cache="/tmp/starship_gh_pr_${key}"
now=$(date +%s)
mtime=$(stat -f %m "$cache" 2>/dev/null || echo 0)
if [ ! -f "$cache" ]; then
  gh pr view --json number,state -q 'select(.state == "OPEN") | .number' > "$cache" 2>/dev/null || : > "$cache"
elif [ $((now - mtime)) -gt 60 ]; then
  (gh pr view --json number,state -q 'select(.state == "OPEN") | .number' > "${cache}.tmp" 2>/dev/null && mv "${cache}.tmp" "$cache" || : > "$cache") >/dev/null 2>&1 &
fi
pr=$(cat "$cache" 2>/dev/null)
[ -n "$pr" ] && printf " PR #%s" "$pr"
'''
style = "bold #9ece6a"
format = "[$output]($style) "
